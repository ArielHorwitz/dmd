default_backend = "claude"
default_always_allow = true

[ui]
session_width = "66%"

[ui.case_colors]
open = "#9ece6a"
closed = "#9a9db0"
blocked = "#f7768e"
paused = "#e0af68"


[backends.claude]
command = [
    "npx",
    "-y",
    "@agentclientprotocol/claude-agent-acp",
    "--",
    "--model",
    "claude-opus-4-8",
]
default_model = "claude-opus-4-8"
